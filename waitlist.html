
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fit In — Coming Soon to iPhone</title>
<meta name="description" content="Fit In is on its way to the App Store. Join the waitlist and be the first to know the moment it's live.">
<link rel="icon" type="image/png" href="/Images/Logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #151518;
    --surface-2: #1c1c20;
    --hairline: #2a2a2e;
    --hairline-strong: #3a3a3e;
    --gold-light: #f5d793;
    --gold-deep: #c9974b;
    --text-primary: #f2f0ea;
    --text-secondary: #9c9a94;
    --text-muted: #6b6a66;
    --success: #7fd99a;
    --error: #e08a7a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, sans-serif;
    height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
    padding: 32px 24px 40px;
  }

  /* Converging corridor backdrop, echoing the launch video's closing frame */
  .corridor {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .corridor svg { width: 100%; height: 100%; }

  .glow {
    animation: pulse 4.5s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow { animation: none; opacity: 0.85; }
  }

  .content {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .mark {
    max-width: 120px;
    max-height: 72px;
    width: auto;
    height: auto;
    object-fit: contain;
    margin-bottom: 28px;
  }

  .eyebrow {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(32px, 8vw, 44px);
    letter-spacing: 0.01em;
    line-height: 1.08;
    text-transform: uppercase;
    background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 18px;
  }

  .sub {
    font-size: 16px;
    line-height: 1.55;
    color: var(--text-secondary);
    max-width: 360px;
    margin-bottom: 36px;
  }

  form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .field-row {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  input[type="email"] {
    flex: 1;
    min-width: 0;
    height: 52px;
    background: var(--surface);
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 0 16px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  input[type="email"]::placeholder { color: var(--text-muted); }

  input[type="email"]:focus {
    border-color: var(--gold-deep);
    box-shadow: 0 0 0 3px rgba(201, 151, 75, 0.15);
  }

  button {
    height: 52px;
    padding: 0 26px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-deep) 100%);
    color: #1a1408;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover { box-shadow: 0 4px 18px rgba(201, 151, 75, 0.35); }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .microcopy {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .status {
    font-size: 14px;
    min-height: 20px;
    margin-top: 6px;
  }

  .status.success { color: var(--success); }
  .status.error { color: var(--error); }

  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 36px 0 24px;
  }

  .divider span {
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }

  .divider p {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .android-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-secondary);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .android-link:hover { color: var(--text-primary); border-color: var(--hairline-strong); }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 48px;
    text-align: center;
  }

  .wordmark {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
  }

  .wordmark b { color: var(--gold-deep); font-weight: 600; }

  .tagline {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  @media (max-width: 400px) {
    .field-row { flex-direction: column; }
    button { width: 100%; }
  }
</style>
</head>
<body>

<div class="corridor" aria-hidden="true">
  <svg viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice">
    <line x1="0" y1="0" x2="400" y2="700" stroke="#c9974b" stroke-width="1" opacity="0.18"/>
    <line x1="800" y1="0" x2="400" y2="700" stroke="#c9974b" stroke-width="1" opacity="0.18"/>
    <line x1="0" y1="1400" x2="400" y2="700" stroke="#c9974b" stroke-width="1" opacity="0.14"/>
    <line x1="800" y1="1400" x2="400" y2="700" stroke="#c9974b" stroke-width="1" opacity="0.14"/>
    <line x1="120" y1="0" x2="400" y2="700" stroke="#c9974b" stroke-width="0.5" opacity="0.1"/>
    <line x1="680" y1="0" x2="400" y2="700" stroke="#c9974b" stroke-width="0.5" opacity="0.1"/>
    <circle class="glow" cx="400" cy="700" r="140" fill="url(#g1)"/>
    <defs>
      <radialGradient id="g1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#c9974b" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#c9974b" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>
</div>

<div class="content">
  <img class="mark" id="brand-mark" src="/Images/Logo/fitin-logo-transparent.png" alt="Fit In">
  <svg class="mark" id="brand-mark-fallback" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fit In logo" style="display:none">
    <path d="M50 82 C20 62, 8 44, 8 28 C8 16, 17 8, 28 8 C37 8, 44 13, 50 22 C56 13, 63 8, 72 8 C83 8, 92 16, 92 28 C92 44, 80 62, 50 82 Z" stroke="url(#goldStroke)" stroke-width="3" fill="none"/>
    <path d="M20 44 L34 44 L40 32 L48 56 L54 40 L60 44 L80 44" stroke="url(#goldStroke)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <defs>
      <linearGradient id="goldStroke" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#f5d793"/>
        <stop offset="100%" stop-color="#c9974b"/>
      </linearGradient>
    </defs>
  </svg>
  <script>
    document.getElementById('brand-mark').addEventListener('error', function () {
      this.style.display = 'none';
      document.getElementById('brand-mark-fallback').style.display = 'block';
    });
  </script>

  <p class="eyebrow">Fit In for iPhone</p>
  <h1>You're almost in.</h1>
  <p class="sub">Fit In is on its way to the App Store. Join the waitlist and we'll email you the moment it's live — no spam, just one message on launch day.</p>

  <form id="waitlist-form" novalidate>
    <div class="field-row">
      <input type="email" id="email" name="email" placeholder="you@email.com" autocomplete="email" required aria-label="Email address">
      <button type="submit" id="submit-btn">Notify me</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>

  <div class="divider"><span></span><p>or</p><span></span></div>

  <a class="android-link" href="https://play.google.com/store/apps/details?id=REPLACE_WITH_PACKAGE_NAME" target="_blank" rel="noopener">
    Already on Android? Get Fit In on Google Play
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</div>

<footer>
  <p class="wordmark">FIT<b>IN</b></p>
  <p class="tagline">Where you have to be fit to be in.</p>
</footer>

<script>
  const form = document.getElementById('waitlist-form');
  const emailInput = document.getElementById('email');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
      statusEl.textContent = 'Enter a valid email address.';
      statusEl.className = 'status error';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Joining...';
    statusEl.textContent = '';
    statusEl.className = 'status';

    try {
      const res = await fetch('/api/waitlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, source: 'ios-waitlist' })
      });

      if (!res.ok) throw new Error('Request failed');

      statusEl.textContent = "You're on the list. Watch your inbox at launch.";
      statusEl.className = 'status success';
      form.reset();
      submitBtn.textContent = 'Notify me';
    } catch (err) {
      statusEl.textContent = "Couldn't join the waitlist. Try again in a moment.";
      statusEl.className = 'status error';
      submitBtn.textContent = 'Notify me';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
